name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gateway-app/ui/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install UI dependencies
        run: npm ci --prefix crates/gateway-app/ui

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check architecture boundaries
        run: python3 scripts/ci/check-architecture-boundaries.py

      - name: Check installer without changing the host
        run: bash packaging/install.sh --dry-run

      - name: Build release binary
        run: cargo build --release --locked -p gateway-app

      - name: Upload Linux release binary
        uses: actions/upload-artifact@v4
        with:
          name: gateway-kit-linux-x86_64
          path: target/release/gateway-kit
          if-no-files-found: error
