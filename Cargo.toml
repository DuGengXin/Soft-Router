[workspace]
resolver = "2"
members = ["crates/gateway-model", "crates/gateway-core", "crates/gateway-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
gateway-model = { path = "crates/gateway-model" }
gateway-core = { path = "crates/gateway-core" }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
base64 = "0.22"
toml = { version = "0.8", features = ["parse", "display"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
