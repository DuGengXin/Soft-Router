[package]
name = "gateway-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gateway-Kit CLI, agent, and embedded Web UI"

[[bin]]
name = "gateway-kit"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
argon2 = "0.5"
clap = { workspace = true }
getrandom = "0.2"
gateway-core = { workspace = true }
gateway-model = { workspace = true }
sha2 = "0.11"
rust-embed = { version = "8.7", features = ["interpolate-folder-path"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
